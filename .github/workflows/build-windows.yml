name: Build Windows EXE

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Generate icon
        shell: pwsh
        run: |
          python scripts\generate_windows_icon.py

      - name: Build Windows executable
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Package artifact
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifact\windows'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'artifact\separador-de-mandados-PJe-windows.zip'

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item -Path 'dist\Separador-de-Mandados-PJe.exe' -Destination $artifactDir -Force
          Copy-Item -Path 'README-Windows.md' -Destination $artifactDir -Force

          if (Test-Path $zipPath) {
            Remove-Item -Path $zipPath -Force
          }

          Compress-Archive -Path "$artifactDir\*" -DestinationPath $zipPath

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: separador-de-mandados-PJe-windows
          path: artifact\separador-de-mandados-PJe-windows.zip
          if-no-files-found: error

