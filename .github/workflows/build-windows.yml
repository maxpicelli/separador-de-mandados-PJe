name: Build Windows EXE

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Generate icon
        shell: pwsh
        run: |
          python scripts\generate_windows_icon.py

      - name: Build Windows executable
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Package artifact
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifact\windows'

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item -Path 'dist\Separador-de-Mandados-PJe.exe' -Destination $artifactDir -Force
          Copy-Item -Path 'README-Windows.md' -Destination $artifactDir -Force

      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: separador-de-mandados-PJe-windows
          path: artifact\windows
          if-no-files-found: error

      - name: Submit SignPath signing request
        if: >-
          env.SIGNPATH_API_TOKEN != '' &&
          env.SIGNPATH_ORGANIZATION_ID != '' &&
          env.SIGNPATH_PROJECT_SLUG != '' &&
          env.SIGNPATH_SIGNING_POLICY_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifact\signed

      - name: Upload signed artifact
        if: >-
          env.SIGNPATH_API_TOKEN != '' &&
          env.SIGNPATH_ORGANIZATION_ID != '' &&
          env.SIGNPATH_PROJECT_SLUG != '' &&
          env.SIGNPATH_SIGNING_POLICY_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: separador-de-mandados-PJe-windows-signed
          path: artifact\signed
          if-no-files-found: error

